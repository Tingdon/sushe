<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>抢宿舍模拟器</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:14px;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    font-weight:500;
    background:#eef1f5;
    color:#333;
    display:flex;justify-content:center;
    min-height:100vh;
  }
  .phone{
    width:100%;max-width:414px;
    min-height:100vh;
    background:#fff;
    position:relative;
    overflow-x:hidden;
    font-weight:600;
  }

  #page-home{
    background:url(images/bg.png) center 30%/cover no-repeat;
    background-color:#f5f7fa;
    min-height:100vh;
    display:flex;flex-direction:column;
    justify-content:center;
    padding:16px;
  }
  #page-home:not(.active){display:none !important}
  #page-home .step-cards{width:100%;max-width:360px;margin:0 auto}

  .navbar{
    position:sticky;top:0;z-index:100;
    background:#1a56db;color:#fff;
    padding:12px 16px;
    display:flex;align-items:center;justify-content:center;
    min-height:44px;
  }
  .navbar.sub{justify-content:flex-start;padding-left:40px}
  .navbar .back{
    position:absolute;left:8px;
    width:32px;height:32px;
    border:none;background:none;
    font-size:18px;color:#fff;
    cursor:pointer;
  }
  .navbar .back:active{opacity:.6}
  .navbar .title{font-size:16px;font-weight:400}

  .page{display:none;padding:16px}
  .page.active{display:block}

  .step-cards{display:flex;flex-direction:column;gap:12px}
  .step-card{
    border:4px solid #e53e3e;border-radius:50px;
    padding:16px 28px 16px 8px;
    display:flex;align-items:center;gap:16px;
    cursor:pointer;user-select:none;
    background:transparent;
  }
  .step-card:active:not(.locked){background:rgba(229,62,62,.04)}
  .step-card.completed{border-color:#16a34a}
  .step-card.locked{opacity:.35;cursor:not-allowed;pointer-events:none}

  .step-icon{
    width:56px;height:48px;border-radius:50px;
    border:4px solid #e53e3e;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:800;color:#e53e3e;
    flex-shrink:0;background:transparent;
  }
  .step-card.completed .step-icon{border-color:#16a34a;color:#16a34a}

  .step-info{flex:1}
  .step-info .step-title{font-size:16px;font-weight:800;color:#e53e3e;text-align:center;letter-spacing:4px}
  .step-card.completed .step-info .step-title{color:#16a34a}

  .step-mark{font-size:24px;margin-left:10px}

  .info-list{
    background:#fff;border:1px solid #d0d5dd;
  }
  .info-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 14px;
    border-bottom:1px solid #eee;
  }
  .info-row:last-child{border-bottom:none}
  .info-row .label{font-size:13px;color:#999}
  .info-row .value{font-size:13px;color:#333}
  .info-input{border:1px solid #d0d5dd;padding:4px 8px;font-size:13px;color:#333;width:140px;text-align:right;outline:none;font-family:inherit}
  .info-input:focus{border-color:#1a56db}

  /* === 缴费页 === */
  #page-pay{
    background:url(images/1.jpg) center/cover no-repeat;
    background-color:#f5f7fa;
    min-height:100vh;
  }

  .pay-top{padding:20px 0 12px;text-align:center}
  .pay-top .pay-label{font-size:18px;color:#999}
  .pay-top .pay-amount{font-size:64px;font-weight:800;color:#1a56db;letter-spacing:6px;line-height:1.2}

  .pay-mid{display:flex;gap:20px;margin-bottom:28px}
  .pay-mid .box{flex:1;border:3px solid #1a56db;padding:32px 20px;text-align:center;border-radius:12px;background:rgba(255,255,255,.7)}
  .pay-mid .box .num{font-size:40px;font-weight:800;color:#1a56db;line-height:1.3}
  .pay-mid .box .txt{font-size:16px;color:#999;margin-top:10px}

  .pay-bot .pay-subtitle{font-size:18px;color:#555;margin-bottom:16px;font-weight:600}

  .fee-list{border:1px solid #d0d5dd;border-radius:8px;overflow-y:auto}
  .fee-row{display:flex;align-items:center;padding:24px 22px;border-bottom:1px solid #f0f0f0;background:rgba(255,255,255,.85);transition:background .1s}
  .fee-row:last-child{border-bottom:none}
  .fee-row:active{background:rgba(240,244,255,.9)}
  .fee-row .fee-name{flex:1;font-size:20px;color:#333;letter-spacing:3px}
  .fee-row .fee-price{font-size:20px;color:#1a56db;margin-right:24px;font-weight:600;letter-spacing:2px}
  .fee-row .fee-check{width:32px;height:32px;border:3px solid #ccc;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:18px;color:transparent;transition:all .15s}
  .fee-row .fee-check.checked{border-color:#1a56db;color:#1a56db;background:rgba(238,243,255,.8)}

  .pay-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:414px;background:#fff;border-top:1px solid #e0e0e0;display:flex;align-items:center;padding:18px 24px;z-index:200;box-shadow:0 -3px 12px rgba(0,0,0,.08)}
  .pay-bar .total{flex:1;font-size:22px;color:#333}
  .pay-bar .total span{font-size:34px;font-weight:800;color:#1a56db}
  .pay-bar .btn-pay{background:#1a56db;color:#fff;font-size:38px;font-weight:800;padding:16px 52px;border-radius:10px;border:none;cursor:pointer;letter-spacing:10px;box-shadow:0 3px 14px rgba(26,86,219,.35)}
  .pay-bar .btn-pay:active{opacity:.85;transform:scale(.97)}
  .countdown-ring{width:100px;height:100px;margin:0 auto 16px;position:relative}
  .countdown-ring svg{transform:rotate(-90deg)}
  .countdown-ring .seconds{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:800;color:#e53e3e}
  .countdown-ring .label{position:absolute;top:70%;left:50%;transform:translate(-50%,-50%);font-size:11px;color:#999}
  .pay-done{text-align:center;padding:30px 0}
  .pay-done-icon{font-size:56px;display:block;margin-bottom:12px}
  .pay-done .txt{font-size:16px;color:#16a34a}
  .room-card{
    background:#fff;padding:12px 14px;
    display:flex;align-items:center;gap:12px;
    cursor:pointer;
  }
  .room-card:active:not(.room-full){background:#f0f4ff}
  .room-card.selected{background:#f0f4ff}
  .room-card.full{opacity:.45;pointer-events:none}
  .room-card .room-num{display:none}
  .room-detail{flex:1}
  .room-detail .room-name{font-size:14px;color:#333}

  .bed-grid{display:flex;flex-direction:column;gap:1px;background:#d0d5dd;border:1px solid #d0d5dd;margin:0 auto 16px}
  .bed-cell{
    background:#fff;padding:10px 14px;
    display:flex;align-items:center;gap:10px;
    font-size:14px;color:#333;cursor:pointer;
  }
  .bed-cell:active{background:#f0f4ff}
  .bed-cell .bed-radio{
    width:18px;height:18px;border-radius:50%;
    border:2px solid #ccc;flex-shrink:0;
    position:relative;
  }
  .bed-cell.selected .bed-radio{border-color:#1a56db}
  .bed-cell.selected .bed-radio::after{
    content:'';position:absolute;top:3px;left:3px;
    width:8px;height:8px;border-radius:50%;
    background:#1a56db;
  }
  .bed-cell.taken{opacity:.3;cursor:not-allowed;pointer-events:none}

  .bed-room-info{
    text-align:left;margin-bottom:12px;
    padding:0 0 8px 0;
    font-size:13px;color:#666;
  }

  .btn{
    display:block;width:100%;
    padding:10px;border:none;
    font-size:14px;cursor:pointer;
    text-align:center;
  }
  .btn-primary{background:#1a56db;color:#fff}
  .btn-primary:active{background:#1548b8}
  .btn-primary:disabled{background:#b0bec5;cursor:not-allowed}
  .btn-success{background:#16a34a;color:#fff}
  .btn-success:active{background:#148a3e}
  .btn-outline{background:#fff;color:#1a56db;border:1px solid #1a56db}
  .btn-outline:active{background:#f0f4ff}
  .btn-wrap{padding:16px 0 8px}

  .toast{
    position:fixed;top:50px;left:50%;transform:translateX(-50%);
    padding:8px 16px;font-size:13px;
    background:#333;color:#fff;
    z-index:999;pointer-events:none;
    opacity:0;transition:opacity .3s;
  }
  .toast.show{opacity:1}

  .success-block{text-align:center;padding:40px 16px}
  .success-block .icon{font-size:56px;margin-bottom:12px}
  .success-block h2{font-size:18px;font-weight:400;color:#333;margin-bottom:6px}
  .success-block p{font-size:13px;color:#999;margin-bottom:6px}

  @media (max-width:360px){
    .pay-top .pay-amount{font-size:42px}
    .pay-mid{gap:10px;margin-bottom:18px}
    .pay-mid .box{padding:20px 10px}
    .pay-mid .box .num{font-size:28px}
    .pay-mid .box .txt{font-size:13px;margin-top:6px}
    .fee-row{padding:16px 12px}
    .fee-row .fee-name{font-size:15px}
    .fee-row .fee-price{font-size:15px;margin-right:12px}
    .fee-row .fee-check{width:26px;height:26px;font-size:16px}
    .pay-bar{padding:10px 12px}
    .pay-bar .total{font-size:16px}
    .pay-bar .total span{font-size:24px}
    .pay-bar .btn-pay{font-size:24px;padding:10px 24px;letter-spacing:4px}
  }
</style>
</head>
<body>

<div class="phone" id="app">
  <div class="toast" id="toast"></div>

  <div class="navbar" id="navbar">
    <button class="back" id="btnBack" style="display:none" onclick="goBack()">&#8592;</button>
    <span class="title" id="navTitle">抢宿舍模拟器</span>
  </div>

  <div class="page active" id="page-home">
    <div class="step-cards">
      <div class="step-card current" id="step1" onclick="showInfo()">
        <div class="step-icon">1</div>
        <div class="step-info"><div class="step-title">个人信息完善</div></div>
        <div class="step-mark">&#10071;</div>
      </div>
      <div class="step-card locked" id="step2" onclick="goPay()">
        <div class="step-icon">2</div>
        <div class="step-info"><div class="step-title">缴费/绿色通道</div></div>
        <div class="step-mark">&#10071;</div>
      </div>
      <div class="step-card locked" id="step3" onclick="goDorm()">
        <div class="step-icon">3</div>
        <div class="step-info"><div class="step-title">网上自选宿舍</div></div>
        <div class="step-mark">&#10071;</div>
      </div>
    </div>
  </div>

  <div class="page" id="page-info">
    <div class="info-list">
      <div class="info-row"><span class="label">姓名</span><input class="info-input" id="inputName" value="张三" placeholder="请输入姓名"></div>
      <div class="info-row"><span class="label">学号</span><span class="value">20240101001</span></div>
      <div class="info-row"><span class="label">学院</span><span class="value">计算机科学与技术学院</span></div>
      <div class="info-row"><span class="label">专业</span><span class="value">软件工程</span></div>
      <div class="info-row"><span class="label">班级</span><span class="value">软工2401班</span></div>
      <div class="info-row"><span class="label">性别</span><span class="value">男</span></div>
      <div class="info-row"><span class="label">手机号</span><span class="value">138****6789</span></div>
    </div>
    <div class="btn-wrap"><button class="btn btn-primary" onclick="confirmName()">确定</button></div>
  </div>

  <div class="page" id="page-pay">
    <div id="payMain">
      <div class="pay-top">
        <div class="pay-label">学费共计</div>
        <div class="pay-amount">&yen;6,250</div>
      </div>
      <div class="pay-mid">
        <div class="box">
          <div class="num" id="debtNum">&yen;6,250</div>
          <div class="txt">欠费条目</div>
        </div>
        <div class="box">
          <div class="num">&yen;0</div>
          <div class="txt">实交金额</div>
        </div>
      </div>
      <div class="pay-bot">
        <div class="pay-subtitle">2026年度待缴信息</div>
        <div class="fee-list" id="feeList"></div>
      </div>
    </div>
    <div id="payProcessing" style="display:none">
      <div class="pay-top">
        <div class="pay-label">正在支付</div>
        <div class="pay-amount">&yen;6,250</div>
      </div>
      <div class="countdown-ring" id="countdown">
        <svg width="100" height="100" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" fill="none" stroke="#e0e0e0" stroke-width="6"/>
          <circle id="progressCircle" cx="50" cy="50" r="42" fill="none" stroke="#e53e3e" stroke-width="6" stroke-linecap="round"/>
        </svg>
        <span class="seconds" id="countSeconds">3</span>
        <span class="label">秒后完成</span>
      </div>
    </div>
    <div id="payDoneBox" style="display:none">
      <div class="pay-done">
        <span class="pay-done-icon">&#9989;</span>
        <div class="txt">缴费成功</div>
      </div>
    <div class="btn-wrap"><button class="btn btn-primary" onclick="confirmName()">确定</button></div>
    </div>
    <div class="pay-bar" id="payBar">
      <span class="total" id="barTotal">合计 <span>&yen;6,250</span></span>
      <button class="btn-pay" id="btnPay" onclick="doPay()">缴</button>
    </div>
  </div>

  <div class="page" id="page-room">
    <div class="room-list" id="roomList"></div>
  </div>

  <div class="page" id="page-bed">
    <div class="bed-room-info" id="bedRoomLabel"></div>
    <div class="bed-grid" id="bedGrid"></div>
    <div class="btn-wrap"><button class="btn btn-success" id="btnSubmitBed" disabled onclick="submitBed()">确认提交</button></div>
  </div>

  <div class="page" id="page-done">
    <div class="success-block">
      <div class="icon">&#127881;</div>
      <h2>宿舍选择成功</h2>
      <p id="doneRoom"></p>
      <p id="doneBed"></p>
      <div class="btn-wrap"><button class="btn btn-outline" onclick="resetAll()">返回首页</button></div>
    </div>
  </div>
</div>

<script>
var CONFIG = {
  student: { name:'张三',sid:'20240101001',college:'计算机科学与技术学院',major:'软件工程',className:'软工2401班',gender:'男',phone:'138****6789' },
  tuition: { amount:6250, term:'2024-2025学年 第一学期' },
  fees:[
    {name:'学费',price:3700},
    {name:'住宿费',price:600},
    {name:'教材费',price:750},
    {name:'体检费',price:30},
    {name:'医疗保险费',price:1170}
  ],
  payCountdown:3,
  rooms:[
    { id:'314',name:'314室',floor:'3层',side:'阳面',beds:[1,2,3,4,5,6,7,8].map(function(n){return{id:''+n,label:''+n,t:0}}) },
    { id:'315',name:'315室',floor:'3层',side:'阴面',beds:[1,2,3,4,5,6,7,8].map(function(n){return{id:''+n,label:''+n,t:0}}) },
    { id:'316',name:'316室',floor:'3层',side:'阳面',beds:[1,2,3,4,5,6,7,8].map(function(n){return{id:''+n,label:''+n,t:0}}) },
    { id:'317',name:'317室',floor:'3层',side:'阴面',beds:[1,2,3,4,5,6,7,8].map(function(n){return{id:''+n,label:''+n,t:0}}) },
    { id:'318',name:'318室',floor:'3层',side:'阳面',beds:[1,2,3,4,5,6,7,8].map(function(n){return{id:''+n,label:''+n,t:0}}) },
    { id:'319',name:'319室',floor:'3层',side:'阴面',beds:[1,2,3,4,5,6,7,8].map(function(n){return{id:''+n,label:''+n,t:0}}) },
    { id:'320',name:'320室',floor:'3层',side:'阳面',beds:[1,2,3,4,5,6,7,8].map(function(n){return{id:''+n,label:''+n,t:0}}) }
  ]
};

var state={step:1,payDone:false,selectedRoom:null,selectedBed:null,history:[],nameDone:false};

function showPage(id,title){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.getElementById(id).classList.add('active');
  document.getElementById('navTitle').textContent=title||'抢宿舍模拟器';
  document.getElementById('btnBack').style.display=id==='page-home'?'none':'';
  var nb=document.getElementById('navbar');
  if(id==='page-home')nb.classList.remove('sub');else nb.classList.add('sub');
  document.getElementById('app').scrollTop=0;window.scrollTo(0,0);
}

function goBack(){
  if(state.history.length>0){var p=state.history.pop();showPage(p.id,p.title);if(p.onEnter)p.onEnter()}
  else showPage('page-home');
}

function confirmName(){
  var name=document.getElementById('inputName').value.trim();
  if(!name){toast('请填写姓名');return}
  if(!state.nameDone){
    state.nameDone=true;state.step=2;
    var s1=document.getElementById('step1');s1.classList.remove('current');s1.classList.add('completed');
    s1.querySelector('.step-mark').innerHTML='&#9989;';
    var s2=document.getElementById('step2');s2.classList.remove('locked');s2.classList.add('current');
  }
  goBack();
}

function pushPage(id,title,fn){
  var cur='';document.querySelectorAll('.page.active').forEach(function(p){cur=p.id});
  state.history.push({id:cur,title:document.getElementById('navTitle').textContent,onEnter:null});
  showPage(id,title);if(fn)fn();
}

function toast(m,d){d=d||2000;var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},d)}
function showInfo(){pushPage('page-info','个人信息')}

function goPay(){if(state.step<2){toast('请先完善个人信息');return}pushPage('page-pay','缴费/绿色通道',startPay)}
function goDorm(){if(!state.payDone){toast('请先完成学费缴纳');return}pushPage('page-room','选择房间',renderRooms)}

var feeChecked=[true,true,true,true,true];

function startPay(){
  if(state.payDone){
    document.getElementById('payMain').style.display='none';
    document.getElementById('payProcessing').style.display='none';
    document.getElementById('payDoneBox').style.display='block';
    document.getElementById('payBar').style.display='none';
    return;
  }
  document.getElementById('payMain').style.display='block';
  document.getElementById('payProcessing').style.display='none';
  document.getElementById('payDoneBox').style.display='none';
  document.getElementById('payBar').style.display='flex';
  renderFees();
}

function renderFees(){
  var h='';feeChecked.forEach(function(v,i){
    var f=CONFIG.fees[i];
    h+='<div class="fee-row" onclick="toggleFee('+i+')">'
      +'<span class="fee-name">'+f.name+'</span>'
      +'<span class="fee-price">&yen;'+f.price+'</span>'
      +'<span class="fee-check'+(v?' checked':'')+'" id="fc'+i+'">'+(v?'&#10003':'')+'</span></div>';
  });
  document.getElementById('feeList').innerHTML=h;
  updatePayBar();
}

function toggleFee(i){
  feeChecked[i]=!feeChecked[i];
  var el=document.getElementById('fc'+i);
  if(feeChecked[i]){el.classList.add('checked');el.innerHTML='&#10003;'}else{el.classList.remove('checked');el.innerHTML=''}
  updatePayBar();
}

function updatePayBar(){
  var sum=0;feeChecked.forEach(function(v,i){if(v)sum+=CONFIG.fees[i].price});
  document.getElementById('barTotal').innerHTML='合计 <span>&yen;'+sum+'</span>';
  document.getElementById('debtNum').innerHTML='&yen;'+sum;
}

function doPay(){
  var sum=0;feeChecked.forEach(function(v,i){if(v)sum+=CONFIG.fees[i].price});
  if(sum===0){toast('请至少勾选一项费用');return}
  document.getElementById('payMain').style.display='none';
  document.getElementById('payProcessing').style.display='block';
  document.getElementById('payBar').style.display='none';
  var total=CONFIG.payCountdown,left=total;
  var c=document.getElementById('progressCircle'),s=document.getElementById('countSeconds');
  var circum=2*Math.PI*42;
  c.style.stroke='#1a56db';c.style.strokeDasharray=circum;c.style.strokeDashoffset='0';s.textContent=left;
  clearInterval(window._pt);
  window._pt=setInterval(function(){
    left--;if(left<=0){clearInterval(window._pt);s.textContent='0';c.style.strokeDashoffset=circum;setTimeout(finishPay,600);return}
    s.textContent=left;c.style.strokeDashoffset=circum*(1-left/total);
  },1000);
}

function finishPay(){
  state.payDone=true;state.step=3;
  document.getElementById('payProcessing').style.display='none';
  document.getElementById('payDoneBox').style.display='block';
  document.getElementById('payBar').style.display='none';
  var s2=document.getElementById('step2');s2.classList.remove('current');s2.classList.add('completed');
  s2.querySelector('.step-mark').innerHTML='&#9989;';
  var s3=document.getElementById('step3');s3.classList.remove('locked');s3.classList.add('current');
  s3.onclick=goDorm;
  setTimeout(function(){if(document.getElementById('page-pay').classList.contains('active'))goBack()},2000);
}

function renderRooms(){
  state.selectedRoom=null;
  var h='';CONFIG.rooms.forEach(function(r){
    var taken=r.beds.filter(function(b){return b.t}).length;
    var full=taken===r.beds.length;
    h+='<div class="room-card'+(full?' full':'')+'" data-room="'+r.id+'" onclick="selectRoom(\''+r.id+'\')">'
      +'<div class="room-detail"><div class="room-name">'+r.id+' 房间</div></div>'
      +'<span style="color:#ccc;font-size:16px">&#8250;</span></div>';
  });
  document.getElementById('roomList').innerHTML=h;
}

function selectRoom(id){state.selectedRoom=id;state.selectedBed=null;goBed()}
function goBed(){if(!state.selectedRoom){toast('请先选择一个房间');return}pushPage('page-bed','选择床位',renderBeds)}

function renderBeds(){
  state.selectedBed=null;document.getElementById('btnSubmitBed').disabled=true;
  var r=CONFIG.rooms.find(function(x){return x.id===state.selectedRoom});if(!r)return;
  document.getElementById('bedRoomLabel').innerHTML=r.name;
  var h='';r.beds.forEach(function(b){
    h+='<div class="bed-cell'+(b.t?' bed-taken':'')+'" data-bed="'+b.id+'" onclick="'+(b.t?'':'selectBed(\''+b.id+'\')')+'">'
      +'<span class="bed-radio"></span>'+b.label+'号</div>';
  });
  document.getElementById('bedGrid').innerHTML=h;
}

function selectBed(id){state.selectedBed=id;document.querySelectorAll('.bed-cell').forEach(function(c){c.classList.remove('selected');if(c.dataset.bed===id)c.classList.add('selected')});document.getElementById('btnSubmitBed').disabled=false}

function submitBed(){
  if(!state.selectedBed){toast('请选择一个床位');return}
  var r=CONFIG.rooms.find(function(x){return x.id===state.selectedRoom});
  var b=r.beds.find(function(x){return x.id===state.selectedBed});
  document.getElementById('doneRoom').textContent='房间：'+r.name;
  document.getElementById('doneBed').textContent='床位：'+b.label;
  pushPage('page-done','提交成功');
  var s3=document.getElementById('step3');s3.classList.remove('current');s3.classList.add('completed');
  s3.querySelector('.step-mark').innerHTML='&#9989;';
}

function resetAll(){
  state.step=1;state.payDone=false;state.nameDone=false;  state.selectedRoom=null;state.selectedBed=null;state.history=[];clearInterval(window._pt);
  feeChecked=[true,true,true,true,true];
  var s1=document.getElementById('step1');s1.classList.remove('completed');s1.classList.add('current');
  s1.querySelector('.step-mark').innerHTML='&#10071;';
  var s2=document.getElementById('step2');s2.classList.remove('current','completed');s2.classList.add('locked');
  s2.querySelector('.step-mark').innerHTML='&#10071;';
  s2.querySelector('.step-mark').innerHTML='&#10071;';
  var s3=document.getElementById('step3');s3.classList.add('locked');s3.classList.remove('current','completed');
  s3.querySelector('.step-mark').innerHTML='&#10071;';
  s3.onclick=goDorm;
  showPage('page-home');document.getElementById('btnBack').style.display='none';
}
</script>
</body>
</html>
